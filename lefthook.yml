# https://lefthook.dev — hooks install automatically on `pnpm install`.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: pnpm exec ultracite fix {staged_files}
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,astro,html,md,mdx,yaml,yml}"
      stage_fixed: true
    - name: oxlint
      run: pnpm exec oxlint --fix {staged_files}
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,astro}"
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: knip
      run: pnpm knip
