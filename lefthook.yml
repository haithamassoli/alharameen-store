# https://lefthook.dev — hooks install on `pnpm install` (prepare script).
pre-commit:
  parallel: true
  jobs:
    - name: ultracite
      # Oxfmt format + Oxlint fix (type-aware, anti-slop) on staged files.
      run: pnpm exec ultracite fix {staged_files}
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,css,astro,html,md,mdx,yaml,yml}"
      stage_fixed: true
    - name: typos
      # Native binary (brew install typos-cli / cargo install typos-cli); skipped if missing.
      run: command -v typos >/dev/null || exit 0; typos --force-exclude {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: knip
      run: pnpm knip
    - name: test
      run: pnpm test
